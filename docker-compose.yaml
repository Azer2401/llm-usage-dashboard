services:
  llm-dashboard-pg:
    image: postgres:15-alpine
    container_name: llm-dashboard-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: llm_dashboard_db
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llmdevops2026
    ports:
      - "5434:5432"
    volumes:
      - llm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_dashboard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  llm-dashboard-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-dashboard-app
    restart: unless-stopped
    depends_on:
      llm-dashboard-pg:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DASHBOARD_DB_HOST=llm-dashboard-pg
      - DASHBOARD_DB_PORT=5432
      - DATABASE_URL=postgresql://llm_user:llmdevops2026@llm-dashboard-pg:5432/llm_dashboard_db?schema=public
      - AITM_DB_HOST=host.docker.internal
      - AITM_DB_PORT=5432
      - AITM_DB_NAME=n8n_db
      - AITM_DB_USER=n8n_user
      - AITM_DB_PASSWORD=n8ndevops
      - GOCLAW_DB_HOST=host.docker.internal
      - GOCLAW_DB_PORT=5433
      - GOCLAW_DB_NAME=goclaw_v314
      - GOCLAW_DB_USER=postgres
      - GOCLAW_DB_PASSWORD=goclaw
      - GOCLAW_API_URL=http://host.docker.internal:18790
      # Channel (WhatsApp) enforcement — see src/services/throttle.js.
      # report = evaluate + audit-log only; enforce = also write GoClaw quota groups.
      - GOCLAW_THROTTLE_MODE=report
      # GoClaw treats a 0 window as UNLIMITED, so a block must be >= 1
      - THROTTLE_BLOCK_LIMIT=1
      # Overrides the stale host path in .env: this is GoClaw's own config file
      - GOCLAW_CONFIG_PATH=/app/data/config.json
      - DEFAULT_MESSAGE_LIMIT=50
    # enforce mode needs GoClaw's config volume, and the first switch to enforce
    # needs one `docker restart goclaw-goclaw-1` (v3.14 builds the quota checker
    # at startup only, and has no SIGHUP/hot reload for it):
    # volumes:
    #   - goclaw_goclaw-data:/app/data
    ports:
      - "3003:3003"
    networks:
      - default

volumes:
  llm_pg_data:
    driver: local
  # goclaw_goclaw-data:
  #   external: true

networks:
  default:
